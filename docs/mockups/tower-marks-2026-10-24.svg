<text x="20" y="32" fill="#e8f0ff" font-size="20" font-weight="bold">Макет знаков: уровень слияния (I–VIII) и ранг (★1–★8). Башня условная: основание, ствол вправо.</text>
<text x="20" y="54" fill="#9fb4d8" font-size="14">Уровень — точки под башней: до четырёх в нижнем ряду (как сейчас), с V — второй ряд оранжевых точек.</text>
<text x="20" y="74" fill="#9fb4d8" font-size="14">Ранг — звёзды в плашке справа вверху: до четырёх в ряду, ★5–★8 — второй ряд; ★8 — светлее.</text>
