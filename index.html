<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b1020" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%236fd36f' stroke='%232f8f3a' stroke-width='4'/%3E%3Ccircle cx='23' cy='27' r='5' fill='%23fff'/%3E%3Ccircle cx='41' cy='27' r='5' fill='%23fff'/%3E%3Ccircle cx='24' cy='28' r='2.5' fill='%230b1020'/%3E%3Ccircle cx='42' cy='28' r='2.5' fill='%230b1020'/%3E%3Cpath d='M22 42q10 8 20 0' stroke='%230b1020' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Таблетки против бактерий</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* Тёмный фон с мягким свечением и узором из «клеточек»: он виден по краям, когда окно не 16:9 (вместо чёрных полос) */
        background:
          radial-gradient(ellipse at 50% 38%, rgba(60, 110, 200, 0.3), transparent 62%),
          radial-gradient(circle at 12% 88%, rgba(255, 77, 94, 0.12), transparent 38%),
          linear-gradient(180deg, #0d1730, #070e20);
        background-color: #0b1020;
        overflow: hidden;
        /* Запрещаем прокрутку, зум и выделение на телефоне: игра управляется касаниями */
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(circle, rgba(120, 170, 255, 0.08) 2px, transparent 3px);
        background-size: 46px 46px;
      }
      canvas {
        display: block;
      }
      /* На компьютере игра — «окно» с рамкой и тенью на фоне; на телефоне она во весь экран без рамок */
      @media (pointer: fine) and (min-width: 900px) {
        canvas {
          border-radius: 12px;
          box-shadow:
            0 0 0 2px rgba(90, 140, 220, 0.55),
            0 22px 70px rgba(0, 0, 0, 0.7);
        }
      }
      /* Телефон вертикально: игра горизонтальная, просим повернуть (текст подставляет main.ts; на компьютере не показывается) */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: #0b1020;
        color: #fff;
        font: bold 22px Arial, 'Segoe UI', Roboto, sans-serif;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <svg width="84" height="84" viewBox="0 0 84 84" fill="none" stroke="#ffd84d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="26" y="8" width="32" height="56" rx="6" />
        <path d="M14 70 q28 16 56 0" />
        <path d="M62 62 l8 8 l-10 4" />
      </svg>
      <div id="rotate-text"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
