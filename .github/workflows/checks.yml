# Автопроверки игры в браузере (qa/smoke.mjs; группы сценариев — .github/smoke-groups.json, набор выбирает задача «План проверок») при каждом push в любую ветку claude/… (рабочая ветка меняется от сессии к сессии, поэтому не одна ветка по имени); также вручную: вкладка Actions → «Проверки (smoke)» → Run workflow.
# Сценарии разложены по параллельным задачам (в каждой они идут по одному — несколько браузеров одновременно на одной машине тормозят и дают ложные красные).
# Упала любая проверка — задача красная, и GitHub присылает письмо о неудачном запуске (включается в GitHub → Settings → Notifications → Actions →
# «Send notifications for failed workflows only» + Email). Снимки всех сценариев — во вложениях прогона (smoke-shots-…), чтобы вид можно было посмотреть и при зелёных проверках.
# Правки только в docs/, *.md и в файлах публикации (preview.yml, pages.yml, publish-pages.sh) проверки не запускают: на игру они не влияют.
name: Проверки (smoke)

on:
  push:
    branches: ['claude/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      # публикация сборок веток и Pages на игру не влияют
      - '.github/workflows/preview.yml'
      - '.github/workflows/pages.yml'
      - '.github/scripts/publish-pages.sh'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка или коммит (пусто — та ветка, с которой запущено)'
        type: string
        default: ''
      scope:
        description: 'Какие сценарии: full — все; auto — по изменениям (если изменён только qa/smoke.mjs — сценарии, которые доходят до изменённых строк, иначе все); или список сценариев и групп через пробел (almanac merge)'
        type: string
        default: 'full'
      base:
        description: 'Для auto: с каким коммитом сравнивать (пусто — общий предок с main)'
        type: string
        default: ''

permissions:
  contents: read

# Новый push отменяет ещё идущие проверки предыдущего (они уже устарели)
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # План: какие сценарии запускать (быстрая проверка, ступень 1 — решение владельца 18 октября 2026; .github/scripts/smoke-scope.mjs). Push — всегда полный набор.
  # Группы сценариев — .github/smoke-groups.json (сценарии в каждой группе идут по одному: несколько браузеров на одной машине тормозят и дают ложные красные).
  plan:
    name: План проверок
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      any: ${{ steps.scope.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: scope
        env:
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'full' }}
          BASE: ${{ inputs.base }}
        run: |
          git fetch --quiet origin main || true
          node .github/scripts/smoke-scope.mjs

  smoke:
    name: ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости и браузер
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Игровая сборка нужна сценарию production, тестовая — остальным
      - name: Собрать игру (игровая и тестовая версии)
        run: |
          npm run build
          npm run build:qa
      - name: Сценарии
        env:
          SCENARIOS: ${{ matrix.scenarios }}
          KEY: ${{ matrix.key }}
          QA_TOWERS_ONLY: ${{ matrix.towers_only }}
        run: |
          failed=0
          {
            echo "### ${{ matrix.group }}"
            echo
            echo "| Сценарий | Результат |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for s in $SCENARIOS; do
            echo "::group::$s"
            if node qa/smoke.mjs --tag="ci-$KEY-$s" --only="$s"; then
              echo "| $s | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $s | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
      - name: Снимки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots-${{ matrix.key }}
          path: qa/screenshots
          if-no-files-found: ignore
          retention-days: 7
