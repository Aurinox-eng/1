# Замер скорости в двух стресс-сценариях: qa/perf.mjs.
# ВРЕМЕННО (ветка стиля, 18 октября 2026): оба сценария, WebGL и canvas, 3 круга, без снимков (canvas-снимки не снимаются за 120 с и съедают ≈ 4 минуты на замер). Перед слиянием вернуть прежний полный запуск (решение владельца 18 октября 2026, п. 1.2).
#   stress — ?qa&stress (40 башен, ≈200 бактерий, ×3);
#   fizz   — ?qa&stress=fizz (12 Шипучек 4-го уровня с мутациями «Цепная» и «Кислота», ≈200 бактерий, ×3: частые взрывы).
# Цель: 95-й процентиль «работы кадра» (расчёт + рисование) ≤ 16,7 мс; он стоит отдельным столбцом итоговой таблицы.
# Сценарий fizz мерится только у версий, где он есть (у «до» его может не быть — тогда пропускается). Один сценарий: --scenario=stress или --scenario=fizz.
# Срабатывает на каждый push в рабочую ветку (кроме правок только в docs/ и *.md) и вручную (Actions → «Замер скорости» → Run workflow).
# Сравнивает текущую версию («после») с версией из файла .github/perf-base («до») на ОДНОЙ машине, поочерёдно; итог — таблица в Summary и в логе.
# На сервере нет видеокарты (WebGL рисуется программно): кадры в секунду отсюда НЕ результат (решение владельца). Смотреть только «до/после»
# и время расчётов на кадр; итог — замер владельца по ?fps на компьютере, iPhone и iPad.
# Код замера (src/perf.ts) для версии «до» берётся из текущей версии, чтобы обе мерились одинаково.
# Перед слиянием ветки стиля вернуть прежний полный запуск этого файла (все сценарии, 5 кругов, со снимками).
name: Замер скорости

on:
  push:
    branches: ['claude/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      # публикация сборок веток и Pages на скорость игры не влияют
      - '.github/workflows/preview.yml'
      - '.github/workflows/pages.yml'
      - '.github/scripts/publish-pages.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: Стресс-сценарии, до и после
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости и браузер
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Собрать текущую версию и версию «до»
        run: |
          npm run build:qa
          BASE=$(tr -d '[:space:]' < .github/perf-base 2>/dev/null || true)
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          if [ -n "$BASE" ] && [ "$BASE" != "$(git rev-parse HEAD)" ]; then
            git worktree add base "$BASE"
            ln -s "$PWD/node_modules" base/node_modules
            # Код замера (счётчик кадров и вызовов рисования) — из текущей версии, чтобы обе версии мерились одинаково
            cp src/perf.ts base/src/perf.ts
            (cd base && npm run build:qa)
          fi
      - name: "Замер (stress и fizz, WebGL и canvas, 3 круга)"
        run: |
          if [ -d base ]; then ROOTS="--roots=base,. --names=до,после"; else ROOTS="--roots=. --names=после"; fi
          node qa/perf.mjs $ROOTS --scenario=stress --renderers=webgl,canvas --rounds=3 --noshots --tag=ci-stress
          node qa/perf.mjs $ROOTS --scenario=fizz --renderers=webgl,canvas --rounds=3 --noshots --tag=ci-fizz
      - name: Снимки и числа
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-shots
          path: |
            qa/screenshots
            qa/perf-results
          if-no-files-found: ignore
          retention-days: 14
