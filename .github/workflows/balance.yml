# Замер баланса ботами. Запуск вручную: вкладка Actions → «Замер баланса (боты)» → Run workflow → поля → зелёная кнопка.
# Каждый профиль, каждый набор исключённых башен (--exclude) и каждая «доля» партий — отдельная параллельная задача (матрица), бот идёт с --canvas.
# Последняя задача («Итоговая таблица») складывает результаты всех задач в одну таблицу: она на странице прогона (раздел Summary, самый низ страницы
# прогона) и в логе задачи; сырые JSON — во вложениях прогона (Artifacts внизу страницы): bot-<тег> по задачам и bot-results-all одним архивом.
# Второй способ запуска — без кнопки: изменить файл .github/balance-request.json (те же поля) и сделать push в рабочую ветку (любая claude/…);
# так запускает замеры агент (кнопка Run workflow появляется на вкладке Actions, только когда этот файл уже лежит в main).
# Подробности и примеры полей — docs/bot-prompts.md.
name: Замер баланса (боты)
run-name: ${{ github.event_name == 'push' && format('Боты · по файлу запроса · {0}', github.sha) || format('Боты · {0} · {1} × {2}{3}{4}', inputs.ref || github.ref_name, inputs.profiles, inputs.runs, inputs.excludes != '-' && inputs.excludes != '' && format(' · без {0}', inputs.excludes) || '', inputs.cfg != '' && format(' · {0}', inputs.cfg) || '') }}

on:
  push:
    branches: ['claude/**']
    paths: ['.github/balance-request.json']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка или коммит (пусто — та ветка, с которой запущено)'
        type: string
        default: ''
      profiles:
        description: 'Стратегии эксперта через запятую (профиль один — expert): expert, zone, solo:X, pair:a+b, focus:a+b, core:a+b'
        type: string
        default: expert
      muts:
        description: 'Наборы мутаций через «|»: «-» — по умолчанию, «alt» — второй набор, или «башня:мутация,мутация;…»'
        type: string
        default: '-'
      runs:
        description: 'Партий на каждую стратегию и набор исключений (партия на 30 волн — 15–45 минут)'
        type: string
        default: '5'
      shards:
        description: 'На сколько параллельных задач разнести партии каждой пары «профиль + набор» (1 — партии идут подряд в одной задаче; равно числу партий — быстрее всего)'
        type: string
        default: '1'
      excludes:
        description: 'Наборы исключённых башен (--exclude), через «;»: «-;syrup» — без исключений и без Сиропа; «fizz,syringe» — без двух башен; «-» — не исключать'
        type: string
        default: '-'
      lamps:
        description: 'Лампы против скрытных (--lamps): 1 — прежний вариант, veteran — «опытный» (Лампа за 3 волны до выхода скрытных), first — «первая встреча» (Лампа по плашке скрытной); несколько через «;», «-» — без Ламп; только стратегия expert; не сочетается с «solos» (пусто — как раньше)'
        type: string
        default: ''
      solos:
        description: 'Варианты «одна башня» (--solo) через «;»: «-;fizz» — обычная игра и только Шипучка + 1 Сироп; башни: pill, fizz, syringe, ampule, antibiotic, lamp, vitamin, frost, patch; только стратегия expert (пусто или «-» — без ограничения)'
        type: string
        default: '-'
      cfg:
        description: 'Подмена чисел (--cfg), например economy.rewardMul:0.85 или waves.hpGrowthPerWave:0.06 (пусто — нет)'
        type: string
        default: ''
      level:
        description: 'Номер уровня 1–10 (от него зависит, какие башни открыты)'
        type: string
        default: '1'
      speed:
        description: 'Ускорение игры для бота (для итоговых чисел — 2; выше 2 замеры грубее)'
        type: string
        default: '2'
      meta:
        description: 'Фиксированные улучшения вне партии для всех партий замера, например lives:2,coins:5,damage:5,reward:5,shield:1,pillRate:3 (id — из таблицы meta.upgrades в config.ts; пусто — без улучшений; не сочетается с «campaign»)'
        type: string
        default: ''
      max_game_sec:
        description: 'Потолок игрового времени одной партии, секунд (пусто — как в боте, 2400; на поздних уровнях партия длиннее 30 минут игрового времени)'
        type: string
        default: ''
      max_real_sec:
        description: 'Потолок реального времени одной партии, секунд (пусто — как в боте, 3600; при большом потолке игрового времени поднять до 7200)'
        type: string
        default: ''
      norender:
        description: '1 — бот без рисования сцены (--norender, ≈ ×3–5 быстрее; волны гибели совпадают с рисованием — сверка 19 октября 2026); 0 — с рисованием (нужно для снимков)'
        type: string
        default: '1'
      campaign:
        description: 'Серии партий (этап 6а): 0 — обычный замер; N — каждая из «партий» играет до N партий подряд с очками ДНК и улучшениями, до первой победы'
        type: string
        default: '0'

permissions:
  contents: read
  actions: read # сторож мест (slots-guard.mjs) читает список идущих запусков

jobs:
  plan:
    name: Список задач
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Поля запуска попадают в скрипт только через переменные окружения (не в текст команд)
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROFILES: ${{ inputs.profiles }}
          MUTS: ${{ inputs.muts }}
          RUNS: ${{ inputs.runs }}
          SHARDS: ${{ inputs.shards }}
          EXCLUDES: ${{ inputs.excludes }}
          SOLOS: ${{ inputs.solos }}
          LAMPS: ${{ inputs.lamps }}
          CFG: ${{ inputs.cfg }}
          LEVEL: ${{ inputs.level }}
          SPEED: ${{ inputs.speed }}
          CAMPAIGN: ${{ inputs.campaign }}
          META: ${{ inputs.meta }}
          MAX_GAME_SEC: ${{ inputs.max_game_sec }}
          MAX_REAL_SEC: ${{ inputs.max_real_sec }}
        run: node .github/scripts/balance-matrix.mjs
      # не больше 14 мест на все длинные серии вместе (лестница и замер баланса): для smoke остаётся не меньше 6 мест из 20
      - name: Сторож мест
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED: ${{ steps.matrix.outputs.count }}
        run: node .github/scripts/slots-guard.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json
          retention-days: 30

  bot:
    name: ${{ matrix.title }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 7 # не больше 7 задач одной серии одновременно (две серии = 14 мест из 20, для smoke остаётся не меньше 6)
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости и браузер
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Собрать тестовую версию игры
        run: npm run build:qa
      - name: Бот
        env:
          PROFILE: ${{ matrix.profile }}
          MUT: ${{ matrix.mut }}
          RUNS: ${{ matrix.runs }}
          EXCLUDE: ${{ matrix.exclude }}
          SOLO: ${{ matrix.solo }}
          LAMPS: ${{ matrix.lamps }}
          CFG: ${{ matrix.cfg }}
          LEVEL: ${{ matrix.level }}
          SPEED: ${{ matrix.speed }}
          CAMPAIGN: ${{ matrix.campaign }}
          META: ${{ matrix.meta }}
          MAX_GAME_SEC: ${{ matrix.max_game_sec }}
          MAX_REAL_SEC: ${{ matrix.max_real_sec }}
          TAG: ${{ matrix.tag }}
          NORENDER: ${{ inputs.norender }}
        run: |
          args=(--strategy="$PROFILE" --runs="$RUNS" --speed="$SPEED" --canvas --level="$LEVEL" --tag="$TAG")
          if [ -n "$MUT" ]; then args+=(--mut="$MUT"); fi
          if [ -n "$EXCLUDE" ]; then args+=(--exclude="$EXCLUDE"); fi
          if [ -n "$SOLO" ]; then args+=(--solo="$SOLO"); fi
          if [ "$LAMPS" = "1" ]; then args+=(--lamps); elif [ -n "$LAMPS" ]; then args+=(--lamps="$LAMPS"); fi
          if [ -n "$CFG" ]; then args+=(--cfg="$CFG"); fi
          if [ -n "$CAMPAIGN" ] && [ "$CAMPAIGN" != "0" ]; then args+=(--campaign="$CAMPAIGN"); fi
          if [ -n "$META" ]; then args+=(--meta="$META"); fi
          if [ "$NORENDER" = "1" ]; then args+=(--norender); fi
          if [ -n "$MAX_GAME_SEC" ]; then args+=(--max-game-sec="$MAX_GAME_SEC"); fi
          if [ -n "$MAX_REAL_SEC" ]; then args+=(--max-real-sec="$MAX_REAL_SEC"); fi
          node qa/bot.mjs "${args[@]}" 2>&1 | tee bot.log
      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-${{ matrix.tag }}
          path: |
            qa/bot-results/*.json
            bot.log
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Итоговая таблица
    needs: [plan, bot]
    # Таблица собирается, даже если часть задач упала: пропавшие попадут в раздел «Проблемы»
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: plan
      - uses: actions/download-artifact@v4
        with:
          pattern: bot-*
          path: results
          merge-multiple: true
      - name: Собрать таблицу
        env:
          BOT_REF: ${{ inputs.ref || github.ref_name }}
          BOT_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          mkdir -p out
          node qa/bot-report.mjs results --plan=plan/plan.json --title="Итог замера бота" > out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "================ ИТОГ ЗАМЕРА (то же, что в Summary) ================"
          cat out/summary.md
          cp -r results out/results
      - uses: actions/upload-artifact@v4
        with:
          name: bot-results-all
          path: out
          retention-days: 30
