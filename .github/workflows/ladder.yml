# «Лестница»: игрок-бот проходит уровни 1…10 подряд (этап 5б, Фаза Б, docs/stage-5b-plan.md). Запуск вручную: Actions → «Лестница (боты по уровням)» → Run workflow,
# либо агентом через API (`actions_run_trigger`, workflow_id ladder.yml). Каждая дорожка — отдельный «игрок» (параллельные задачи); на каждом уровне она играет до k партий
# до первой победы, очки ДНК и покупки переходят на следующий уровень через вложение `ladder-state-L<уровень>-lane<дорожка>`.
# Итог — задача «Итоговая таблица» (партий до первой победы по уровням); сырые JSON — вложения `ladder-res-*` и `ladder-results-all`.
# Предельное время одной задачи — 5 ч 50 мин: k партий × ≈ 35–60 мин реального времени; для проверки цепочки — to_level=2, k=2.
name: Лестница (боты по уровням)
run-name: ${{ github.event_name == 'push' && format('Лестница · по файлу запроса · {0}', github.sha) || format('Лестница · {0} · {1} дор. · до {2} парт. · уровни 1–{3}', inputs.profile, inputs.lanes, inputs.k, inputs.to_level) }}

on:
  # Без кнопки: изменить `.github/ladder-request.json` (поля profile, lanes, k, to_level, speed, cfg) и сделать push в рабочую ветку; кнопка Run workflow
  # появляется на вкладке Actions, только когда этот файл уже лежит в main.
  push:
    branches: [claude/serene-rubin-x3t2gu]
    paths: ['.github/ladder-request.json']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка или коммит'
        type: string
        default: claude/serene-rubin-x3t2gu
      profile:
        description: 'Профиль бота: novice, average, strong или expert'
        type: string
        default: strong
      lanes:
        description: 'Сколько дорожек (независимых игроков), 1–10'
        type: string
        default: '6'
      k:
        description: 'Сколько партий на уровне до первой победы (потом дорожка «застревает»)'
        type: string
        default: '8'
      to_level:
        description: 'До какого уровня идти (1–10; для проверки цепочки — 2)'
        type: string
        default: '10'
      speed:
        description: 'Ускорение игры для бота (для итоговых чисел — 2)'
        type: string
        default: '2'
      cfg:
        description: 'Подмена чисел (--cfg), например waves.hpGrowthPerWave:0.06 (пусто — нет)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: Список дорожек
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      lanes: ${{ steps.plan.outputs.lanes }}
      k: ${{ steps.plan.outputs.k }}
      to_level: ${{ steps.plan.outputs.to_level }}
      speed: ${{ steps.plan.outputs.speed }}
      cfg: ${{ steps.plan.outputs.cfg }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Поля запуска попадают в скрипт только через переменные окружения (не в текст команд)
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROFILE: ${{ inputs.profile }}
          LANES: ${{ inputs.lanes }}
          K: ${{ inputs.k }}
          TO_LEVEL: ${{ inputs.to_level }}
          SPEED: ${{ inputs.speed }}
          CFG: ${{ inputs.cfg }}
        run: node .github/scripts/ladder-plan.mjs

  l01:
    name: Уровень 1
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.to_level) >= 1 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 1
      prev: 0
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}

  l02:
    name: Уровень 2
    needs: [plan, l01]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l01.result == 'success' || needs.l01.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 2 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 2
      prev: 1
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}

  l03:
    name: Уровень 3
    needs: [plan, l02]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l02.result == 'success' || needs.l02.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 3 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 3
      prev: 2
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}

  l04:
    name: Уровень 4
    needs: [plan, l03]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l03.result == 'success' || needs.l03.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 4 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 4
      prev: 3
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}

  l05:
    name: Уровень 5
    needs: [plan, l04]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l04.result == 'success' || needs.l04.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 5 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 5
      prev: 4
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}

  l06:
    name: Уровень 6
    needs: [plan, l05]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l05.result == 'success' || needs.l05.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 6 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 6
      prev: 5
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}

  l07:
    name: Уровень 7
    needs: [plan, l06]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l06.result == 'success' || needs.l06.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 7 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 7
      prev: 6
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}

  l08:
    name: Уровень 8
    needs: [plan, l07]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l07.result == 'success' || needs.l07.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 8 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 8
      prev: 7
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}

  l09:
    name: Уровень 9
    needs: [plan, l08]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l08.result == 'success' || needs.l08.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 9 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 9
      prev: 8
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}

  l10:
    name: Уровень 10
    needs: [plan, l09]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l09.result == 'success' || needs.l09.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 10 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 10
      prev: 9
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}

  report:
    name: Итоговая таблица
    needs: [plan, l01, l02, l03, l04, l05, l06, l07, l08, l09, l10]
    # Таблица собирается, даже если часть уровней упала или пропущена
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: ladder-res-*
          path: results
          merge-multiple: true
      - name: Собрать таблицу
        run: |
          mkdir -p out
          node qa/bot-report.mjs results --title="Итог лестницы" > out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "================ ИТОГ ЛЕСТНИЦЫ (то же, что в Summary) ================"
          cat out/summary.md
          cp -r results out/results
      - uses: actions/upload-artifact@v4
        with:
          name: ladder-results-all
          path: out
          retention-days: 30
