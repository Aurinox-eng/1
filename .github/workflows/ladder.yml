# «Лестница»: игрок-бот проходит уровни 1…10 подряд (этап 5б, Фаза Б, docs/stage-5b-plan.md). Запуск вручную: Actions → «Лестница (боты по уровням)» → Run workflow,
# либо агентом через API (`actions_run_trigger`, workflow_id ladder.yml). Каждая дорожка — отдельный «игрок» (параллельные задачи); на каждом уровне она играет до k партий
# до первой победы, очки ДНК и покупки переходят на следующий уровень через вложение `ladder-state-L<уровень>-lane<дорожка>`.
# Итог — задача «Итоговая таблица» (партий до первой победы по уровням); сырые JSON — вложения `ladder-res-*` и `ladder-results-all`.
# Предельное время одной задачи — 5 ч 50 мин: k партий × ≈ 35–60 мин реального времени; для проверки цепочки — to_level=2, k=2.
name: Лестница (боты по уровням)
run-name: ${{ github.event_name == 'push' && format('Лестница · по файлу запроса · {0}', github.sha) || format('Лестница · {0} · {1} дор. · до {2} парт. · уровни 1–{3}', inputs.profile, inputs.lanes, inputs.k, inputs.to_level) }}

on:
  # Без кнопки: изменить `.github/ladder-request.json` (поля profile, mut, lanes, k, to_level, speed, cfg, farm) и сделать push в рабочую ветку; кнопка Run workflow
  # появляется на вкладке Actions, только когда этот файл уже лежит в main.
  push:
    branches: ['claude/**']
    paths: ['.github/ladder-request.json']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка или коммит (пусто — та ветка, с которой запущено)'
        type: string
        default: ''
      profile:
        description: 'Стратегия эксперта (профиль один): expert, zone, review, solo:X, pair:a+b, focus:a+b, core:a+b'
        type: string
        default: expert
      mut:
        description: 'Набор мутаций: пусто — по умолчанию, alt — второй набор, или «башня:мутация,мутация;…»'
        type: string
        default: ''
      lanes:
        description: 'Сколько дорожек (независимых игроков), 1–10'
        type: string
        default: '6'
      k:
        description: 'Сколько партий на уровне до первой победы (потом дорожка «застревает»)'
        type: string
        default: '8'
      to_level:
        description: 'До какого уровня идти (1–10; для проверки цепочки — 2)'
        type: string
        default: '10'
      speed:
        description: 'Ускорение игры для бота (для итоговых чисел — 2)'
        type: string
        default: '2'
      cfg:
        description: 'Подмена чисел (--cfg), например waves.hpGrowthPerWave:0.06 (пусто — нет)'
        type: string
        default: ''
      farm:
        description: 'Контроль фарма очков ДНК: после первой победы на уровне одна повторная партия на пройденном (1 — да, 0 — нет)'
        type: string
        default: '0'
      budget_sec:
        description: 'Бюджет реального времени одной задачи бота, секунд (по умолчанию 19800 = 5 ч 30 мин; при k_total больше k): новая партия не начинается, если не успеет закончиться до него, уровень доиграет следующая задача'
        type: string
        default: '19800'
      k_total:
        description: 'Всего партий на уровне до «застряла» (пусто — столько же, сколько k). Больше k — уровень играется несколькими задачами подряд по k партий (предел задачи 5 ч 50 мин); например k 10, k_total 20'
        type: string
        default: ''
      max_real_sec:
        description: 'Потолок реального времени одной партии бота, секунд (по умолчанию 7200; при 3600 партии на 25–30-й волне обрывались как timeout и не приносили очков ДНК)'
        type: string
        default: '7200'
      from_level:
        description: 'С какого уровня начинать (по умолчанию 1). Больше 1 — нужен state_run: состояние дорожек берётся из вложений ladder-state-L<from_level − 1>-lane<N> (при k_total > k — с суффиксом -b, итог последнего куска уровня) того прогона'
        type: string
        default: '1'
      state_run:
        description: 'Номер прогона (run id), из вложений которого берётся состояние дорожек при from_level больше 1 (его дорожки должны быть теми же профилем и номерами)'
        type: string
        default: ''
      norender:
        description: '1 — бот без рисования сцены (≈ ×3–5 быстрее, волны гибели совпадают с рисованием — сверка 19 октября 2026); 0 — с рисованием'
        type: string
        default: '1'
      max_parallel:
        description: 'Сколько дорожек одной серии идёт одновременно (по умолчанию 7). На аккаунте 20 мест на все задачи: две серии по 7 дорожек занимают 14, и для проверок (smoke) остаётся не меньше 6; больше двух серий одновременно не запускать'
        type: string
        default: '7'

permissions:
  contents: read
  actions: read # сторож мест (slots-guard.mjs) читает список идущих запусков

jobs:
  plan:
    name: Список дорожек
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      mut: ${{ steps.plan.outputs.mut }}
      lanes: ${{ steps.plan.outputs.lanes }}
      k: ${{ steps.plan.outputs.k }}
      to_level: ${{ steps.plan.outputs.to_level }}
      speed: ${{ steps.plan.outputs.speed }}
      cfg: ${{ steps.plan.outputs.cfg }}
      farm: ${{ steps.plan.outputs.farm }}
      max_real_sec: ${{ steps.plan.outputs.max_real_sec }}
      k_total: ${{ steps.plan.outputs.k_total }}
      chunked: ${{ steps.plan.outputs.chunked }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      from_level: ${{ steps.plan.outputs.from_level }}
      state_run: ${{ steps.plan.outputs.state_run }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Поля запуска попадают в скрипт только через переменные окружения (не в текст команд)
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROFILE: ${{ inputs.profile }}
          MUT: ${{ inputs.mut }}
          LANES: ${{ inputs.lanes }}
          K: ${{ inputs.k }}
          TO_LEVEL: ${{ inputs.to_level }}
          SPEED: ${{ inputs.speed }}
          CFG: ${{ inputs.cfg }}
          FARM: ${{ inputs.farm }}
          MAX_REAL_SEC: ${{ inputs.max_real_sec }}
          K_TOTAL: ${{ inputs.k_total }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          FROM_LEVEL: ${{ inputs.from_level }}
          STATE_RUN: ${{ inputs.state_run }}
        run: node .github/scripts/ladder-plan.mjs
      # не больше 14 мест на все длинные серии вместе (лестница и замер баланса): для smoke остаётся не меньше 6 мест из 20
      - name: Сторож мест
        env:
          GH_TOKEN: ${{ github.token }}
          LANES_JSON: ${{ steps.plan.outputs.lanes }}
          MAX_PARALLEL: ${{ steps.plan.outputs.max_parallel }}
        run: node .github/scripts/slots-guard.mjs

  l01:
    name: Уровень 1
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.to_level) >= 1 && fromJSON(needs.plan.outputs.from_level) <= 1 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 1
      state_run: ${{ needs.plan.outputs.from_level == '1' && needs.plan.outputs.state_run || '' }}
      prev: 0
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      mut: ${{ needs.plan.outputs.mut }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}
      farm: ${{ needs.plan.outputs.farm }}
      max_real_sec: ${{ needs.plan.outputs.max_real_sec }}
      k_total: ${{ needs.plan.outputs.k_total }}
      chunked: ${{ needs.plan.outputs.chunked }}
      budget_sec: ${{ inputs.budget_sec || '19800' }}
      max_parallel: ${{ needs.plan.outputs.max_parallel }}
      norender: ${{ inputs.norender || '1' }}

  l02:
    name: Уровень 2
    needs: [plan, l01]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l01.result == 'success' || needs.l01.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 2 && fromJSON(needs.plan.outputs.from_level) <= 2 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 2
      state_run: ${{ needs.plan.outputs.from_level == '2' && needs.plan.outputs.state_run || '' }}
      prev: 1
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      mut: ${{ needs.plan.outputs.mut }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}
      farm: ${{ needs.plan.outputs.farm }}
      max_real_sec: ${{ needs.plan.outputs.max_real_sec }}
      k_total: ${{ needs.plan.outputs.k_total }}
      chunked: ${{ needs.plan.outputs.chunked }}
      budget_sec: ${{ inputs.budget_sec || '19800' }}
      max_parallel: ${{ needs.plan.outputs.max_parallel }}
      norender: ${{ inputs.norender || '1' }}

  l03:
    name: Уровень 3
    needs: [plan, l02]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l02.result == 'success' || needs.l02.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 3 && fromJSON(needs.plan.outputs.from_level) <= 3 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 3
      state_run: ${{ needs.plan.outputs.from_level == '3' && needs.plan.outputs.state_run || '' }}
      prev: 2
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      mut: ${{ needs.plan.outputs.mut }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}
      farm: ${{ needs.plan.outputs.farm }}
      max_real_sec: ${{ needs.plan.outputs.max_real_sec }}
      k_total: ${{ needs.plan.outputs.k_total }}
      chunked: ${{ needs.plan.outputs.chunked }}
      budget_sec: ${{ inputs.budget_sec || '19800' }}
      max_parallel: ${{ needs.plan.outputs.max_parallel }}
      norender: ${{ inputs.norender || '1' }}

  l04:
    name: Уровень 4
    needs: [plan, l03]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l03.result == 'success' || needs.l03.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 4 && fromJSON(needs.plan.outputs.from_level) <= 4 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 4
      state_run: ${{ needs.plan.outputs.from_level == '4' && needs.plan.outputs.state_run || '' }}
      prev: 3
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      mut: ${{ needs.plan.outputs.mut }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}
      farm: ${{ needs.plan.outputs.farm }}
      max_real_sec: ${{ needs.plan.outputs.max_real_sec }}
      k_total: ${{ needs.plan.outputs.k_total }}
      chunked: ${{ needs.plan.outputs.chunked }}
      budget_sec: ${{ inputs.budget_sec || '19800' }}
      max_parallel: ${{ needs.plan.outputs.max_parallel }}
      norender: ${{ inputs.norender || '1' }}

  l05:
    name: Уровень 5
    needs: [plan, l04]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l04.result == 'success' || needs.l04.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 5 && fromJSON(needs.plan.outputs.from_level) <= 5 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 5
      state_run: ${{ needs.plan.outputs.from_level == '5' && needs.plan.outputs.state_run || '' }}
      prev: 4
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      mut: ${{ needs.plan.outputs.mut }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}
      farm: ${{ needs.plan.outputs.farm }}
      max_real_sec: ${{ needs.plan.outputs.max_real_sec }}
      k_total: ${{ needs.plan.outputs.k_total }}
      chunked: ${{ needs.plan.outputs.chunked }}
      budget_sec: ${{ inputs.budget_sec || '19800' }}
      max_parallel: ${{ needs.plan.outputs.max_parallel }}
      norender: ${{ inputs.norender || '1' }}

  l06:
    name: Уровень 6
    needs: [plan, l05]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l05.result == 'success' || needs.l05.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 6 && fromJSON(needs.plan.outputs.from_level) <= 6 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 6
      state_run: ${{ needs.plan.outputs.from_level == '6' && needs.plan.outputs.state_run || '' }}
      prev: 5
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      mut: ${{ needs.plan.outputs.mut }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}
      farm: ${{ needs.plan.outputs.farm }}
      max_real_sec: ${{ needs.plan.outputs.max_real_sec }}
      k_total: ${{ needs.plan.outputs.k_total }}
      chunked: ${{ needs.plan.outputs.chunked }}
      budget_sec: ${{ inputs.budget_sec || '19800' }}
      max_parallel: ${{ needs.plan.outputs.max_parallel }}
      norender: ${{ inputs.norender || '1' }}

  l07:
    name: Уровень 7
    needs: [plan, l06]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l06.result == 'success' || needs.l06.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 7 && fromJSON(needs.plan.outputs.from_level) <= 7 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 7
      state_run: ${{ needs.plan.outputs.from_level == '7' && needs.plan.outputs.state_run || '' }}
      prev: 6
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      mut: ${{ needs.plan.outputs.mut }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}
      farm: ${{ needs.plan.outputs.farm }}
      max_real_sec: ${{ needs.plan.outputs.max_real_sec }}
      k_total: ${{ needs.plan.outputs.k_total }}
      chunked: ${{ needs.plan.outputs.chunked }}
      budget_sec: ${{ inputs.budget_sec || '19800' }}
      max_parallel: ${{ needs.plan.outputs.max_parallel }}
      norender: ${{ inputs.norender || '1' }}

  l08:
    name: Уровень 8
    needs: [plan, l07]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l07.result == 'success' || needs.l07.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 8 && fromJSON(needs.plan.outputs.from_level) <= 8 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 8
      state_run: ${{ needs.plan.outputs.from_level == '8' && needs.plan.outputs.state_run || '' }}
      prev: 7
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      mut: ${{ needs.plan.outputs.mut }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}
      farm: ${{ needs.plan.outputs.farm }}
      max_real_sec: ${{ needs.plan.outputs.max_real_sec }}
      k_total: ${{ needs.plan.outputs.k_total }}
      chunked: ${{ needs.plan.outputs.chunked }}
      budget_sec: ${{ inputs.budget_sec || '19800' }}
      max_parallel: ${{ needs.plan.outputs.max_parallel }}
      norender: ${{ inputs.norender || '1' }}

  l09:
    name: Уровень 9
    needs: [plan, l08]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l08.result == 'success' || needs.l08.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 9 && fromJSON(needs.plan.outputs.from_level) <= 9 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 9
      state_run: ${{ needs.plan.outputs.from_level == '9' && needs.plan.outputs.state_run || '' }}
      prev: 8
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      mut: ${{ needs.plan.outputs.mut }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}
      farm: ${{ needs.plan.outputs.farm }}
      max_real_sec: ${{ needs.plan.outputs.max_real_sec }}
      k_total: ${{ needs.plan.outputs.k_total }}
      chunked: ${{ needs.plan.outputs.chunked }}
      budget_sec: ${{ inputs.budget_sec || '19800' }}
      max_parallel: ${{ needs.plan.outputs.max_parallel }}
      norender: ${{ inputs.norender || '1' }}

  l10:
    name: Уровень 10
    needs: [plan, l09]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.l09.result == 'success' || needs.l09.result == 'skipped') && fromJSON(needs.plan.outputs.to_level) >= 10 && fromJSON(needs.plan.outputs.from_level) <= 10 }}
    uses: ./.github/workflows/ladder-level.yml
    with:
      level: 10
      state_run: ${{ needs.plan.outputs.from_level == '10' && needs.plan.outputs.state_run || '' }}
      prev: 9
      sha: ${{ needs.plan.outputs.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      mut: ${{ needs.plan.outputs.mut }}
      lanes_json: ${{ needs.plan.outputs.lanes }}
      k: ${{ needs.plan.outputs.k }}
      speed: ${{ needs.plan.outputs.speed }}
      cfg: ${{ needs.plan.outputs.cfg }}
      farm: ${{ needs.plan.outputs.farm }}
      max_real_sec: ${{ needs.plan.outputs.max_real_sec }}
      k_total: ${{ needs.plan.outputs.k_total }}
      chunked: ${{ needs.plan.outputs.chunked }}
      budget_sec: ${{ inputs.budget_sec || '19800' }}
      max_parallel: ${{ needs.plan.outputs.max_parallel }}
      norender: ${{ inputs.norender || '1' }}

  report:
    name: Итоговая таблица
    needs: [plan, l01, l02, l03, l04, l05, l06, l07, l08, l09, l10]
    # Таблица собирается, даже если часть уровней упала или пропущена
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: ladder-res-*
          path: results
          merge-multiple: true
      # первые задачи уровней, доигранных двумя задачами: файлы с тем же именем, что у продолжения, — отдельной папкой (их «⚠» и ошибки — в раздел «Проблемы»)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ladder-chunk-*
          path: chunks
      - name: Собрать таблицу
        run: |
          mkdir -p out chunks
          node qa/bot-report.mjs results --chunks=chunks --title="Итог лестницы" > out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "================ ИТОГ ЛЕСТНИЦЫ (то же, что в Summary) ================"
          cat out/summary.md
          cp -r results out/results
      - uses: actions/upload-artifact@v4
        with:
          name: ladder-results-all
          path: out
          retention-days: 30
