# Один уровень «лестницы» (вызывается из ladder.yml): параллельные дорожки (по задаче на дорожку), каждая берёт состояние предыдущего уровня из вложения,
# играет уровень до первой победы (не больше k партий) и сохраняет состояние для следующего уровня. Описание — docs/stage-5b-plan.md, раздел 5.
name: Лестница — один уровень
on:
  workflow_call:
    inputs:
      level:
        type: number
        required: true
      prev:
        description: 'Номер предыдущего уровня (его состояние берётся из вложения); у уровня 1 не используется'
        type: number
        required: true
      state_run:
        description: 'Номер прогона, из вложений которого берётся состояние дорожек (только у первого уровня серии, начатой не с уровня 1); пусто — вложения этого же прогона'
        type: string
        default: ''
      sha:
        type: string
        required: true
      profile:
        description: 'Стратегия эксперта: expert, zone, review, solo:X, pair:a+b, focus:a+b, core:a+b'
        type: string
        required: true
      mut:
        description: 'Набор мутаций (--mut): пусто — по умолчанию'
        type: string
        default: ''
      lanes_json:
        type: string
        required: true
      k:
        type: string
        required: true
      speed:
        type: string
        required: true
      cfg:
        type: string
        default: ''
      farm:
        type: string
        default: '0'
      max_real_sec:
        type: string
        default: '7200'
      k_total:
        description: 'Всего партий на уровне (по умолчанию k)'
        type: string
        default: ''
      budget_sec:
        description: 'Бюджет реального времени задачи для бота, секунд (при chunked): новая партия не начинается, если не успеет закончиться до него'
        type: string
        default: '19800'
      max_parallel:
        description: 'Сколько дорожек идёт одновременно (strategy.max-parallel): на аккаунте 20 мест на все задачи, серии не должны занимать больше 14'
        type: string
        default: '7'
      norender:
        description: '1 — бот без рисования сцены (--norender, ≈ ×3–5 быстрее; волны гибели совпадают с рисованием — сверка 19 октября 2026, docs/process-speedup-2026-10-18.md, раздел 4.3); 0 — с рисованием'
        type: string
        default: '1'
      chunked:
        description: 'true — уровень играется двумя задачами подряд (k партий в каждой): состояние и результаты первой лежат в ladder-state-…/ladder-chunk-…, второй — в …-b'
        type: string
        default: 'false'

permissions:
  contents: read
  actions: read # вложения другого прогона (state_run)

jobs:
  lane:
    name: уровень ${{ inputs.level }} · дорожка ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        lane: ${{ fromJSON(inputs.lanes_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости и браузер
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Собрать тестовую версию игры
        run: npm run build:qa
      - name: Состояние дорожки с прошлого уровня
        if: ${{ inputs.level > 1 && inputs.state_run == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ladder-state-L${{ inputs.prev }}-lane${{ matrix.lane }}${{ inputs.chunked == 'true' && '-b' || '' }}
          path: state-in
      - name: Состояние дорожки из другого прогона (state_run)
        if: ${{ inputs.level > 1 && inputs.state_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ladder-state-L${{ inputs.prev }}-lane${{ matrix.lane }}${{ inputs.chunked == 'true' && '-b' || '' }}
          path: state-in
          run-id: ${{ inputs.state_run }}
          github-token: ${{ github.token }}
      - name: Бот
        env:
          PROFILE: ${{ inputs.profile }}
          MUT: ${{ inputs.mut }}
          LEVEL: ${{ inputs.level }}
          LANE: ${{ matrix.lane }}
          K: ${{ inputs.k }}
          SPEED: ${{ inputs.speed }}
          CFG: ${{ inputs.cfg }}
          FARM: ${{ inputs.farm }}
          MAX_REAL: ${{ inputs.max_real_sec }}
          KTOT: ${{ inputs.k_total }}
          CHUNKED: ${{ inputs.chunked }}
          BUDGET: ${{ inputs.budget_sec }}
          NORENDER: ${{ inputs.norender }}
        run: |
          args=(--strategy="$PROFILE" --runs=1 --run-offset=$((LANE - 1)) --speed="$SPEED" --canvas --ladder="$K" --from-level="$LEVEL" --to-level="$LEVEL" --state-out=state-out.json --max-real-sec="$MAX_REAL" --tag="ladder-L${LEVEL}-lane${LANE}")
          if [ "$LEVEL" -gt 1 ]; then args+=(--state-in=state-in/state-out.json); fi
          if [ -n "$CFG" ]; then args+=(--cfg="$CFG"); fi
          if [ -n "$MUT" ]; then args+=(--mut="$MUT"); fi
          if [ "$FARM" = "1" ]; then args+=(--farm); fi
          if [ "$NORENDER" = "1" ]; then args+=(--norender); fi
          if [ "$CHUNKED" = "true" ]; then args+=(--ladder-total="$KTOT" --ladder-budget-sec="$BUDGET"); fi
          node qa/bot.mjs "${args[@]}" 2>&1 | tee bot.log
      - name: Сохранить состояние дорожки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-state-L${{ inputs.level }}-lane${{ matrix.lane }}
          path: state-out.json
          if-no-files-found: warn
          retention-days: 30
      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.chunked == 'true' && 'ladder-chunk' || 'ladder-res' }}-L${{ inputs.level }}-lane${{ matrix.lane }}
          path: |
            qa/bot-results/*.json
            bot.log
          if-no-files-found: warn
          retention-days: 30

  # Вторая задача того же уровня (только при chunked): доигрывает уровень с состоянием первой (`--state-in`), если дорожка не выиграла и партий меньше k_total;
  # у выигравших и застрявших дорожек бот ничего не играет. Итог уровня — результаты `ladder-res-…` этой задачи (в них запись дорожки по всем партиям уровня).
  lane_b:
    name: уровень ${{ inputs.level }} · дорожка ${{ matrix.lane }} (продолжение)
    needs: [lane]
    if: ${{ !cancelled() && inputs.chunked == 'true' && (needs.lane.result == 'success' || needs.lane.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        lane: ${{ fromJSON(inputs.lanes_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости и браузер
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Собрать тестовую версию игры
        run: npm run build:qa
      - name: Состояние дорожки после первой задачи уровня
        uses: actions/download-artifact@v4
        with:
          name: ladder-state-L${{ inputs.level }}-lane${{ matrix.lane }}
          path: state-in
      - name: Бот
        env:
          PROFILE: ${{ inputs.profile }}
          MUT: ${{ inputs.mut }}
          LEVEL: ${{ inputs.level }}
          LANE: ${{ matrix.lane }}
          K: ${{ inputs.k }}
          SPEED: ${{ inputs.speed }}
          CFG: ${{ inputs.cfg }}
          FARM: ${{ inputs.farm }}
          MAX_REAL: ${{ inputs.max_real_sec }}
          KTOT: ${{ inputs.k_total }}
          BUDGET: ${{ inputs.budget_sec }}
          NORENDER: ${{ inputs.norender }}
        run: |
          args=(--strategy="$PROFILE" --runs=1 --run-offset=$((LANE - 1)) --speed="$SPEED" --canvas --ladder="$K" --ladder-total="$KTOT" --ladder-budget-sec="$BUDGET" --ladder-last --from-level="$LEVEL" --to-level="$LEVEL" --state-in=state-in/state-out.json --state-out=state-out.json --max-real-sec="$MAX_REAL" --tag="ladder-L${LEVEL}-lane${LANE}")
          if [ -n "$CFG" ]; then args+=(--cfg="$CFG"); fi
          if [ -n "$MUT" ]; then args+=(--mut="$MUT"); fi
          if [ "$FARM" = "1" ]; then args+=(--farm); fi
          if [ "$NORENDER" = "1" ]; then args+=(--norender); fi
          node qa/bot.mjs "${args[@]}" 2>&1 | tee bot.log
      - name: Сохранить состояние дорожки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-state-L${{ inputs.level }}-lane${{ matrix.lane }}-b
          path: state-out.json
          if-no-files-found: warn
          retention-days: 30
      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-res-L${{ inputs.level }}-lane${{ matrix.lane }}
          path: |
            qa/bot-results/*.json
            bot.log
          if-no-files-found: warn
          retention-days: 30
